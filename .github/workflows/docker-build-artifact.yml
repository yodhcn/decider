name: docker-build-artifact

# Builds the CUDA 12.6 / torch 2.7.1 image (decider.serve on decider.engine_v2.EngineV2) and uploads it as a
# workflow artifact (`docker save | gzip`). Nothing is pushed to a registry: download the artifact from the run
# page and `gzip -dc decider-torch-*.tar.gz | docker load`.
#
# Manual only -- a multi-GB artifact does not belong on every push.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Mapika/decider git ref: branch, tag or commit SHA"
        required: false
        default: "main"
      torch_index:
        description: "PyTorch wheel index. cu126, not cu124: CUDA 12.x is minor-version compatible, so the 550 driver runs it, and cu124 stops at torch 2.6.0 (triton 3.2.0, below flash-linear-attention's 3.3 floor). The last path segment becomes part of the tag."
        required: false
        default: "https://download.pytorch.org/whl/cu126"
      torch_spec:
        description: "Requirement to install from that index. torch==2.7.1 pins triton 3.3.1, which is what fla requires; 2.8.0 pins triton 3.4.0 and compiles sm_86 with ptxas 12.8. 'torch' takes the newest wheel in the index."
        required: false
        default: "torch==2.7.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # torch's CUDA wheels carry their own CUDA user space (cudart, cuBLAS, cuDNN, NCCL, nvrtc) and a hosted
      # runner has roughly 14 GB free, which the venv plus the saved tar will not fit in.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      # Inputs are validated here and published both as step outputs (for `with:`) and as environment variables
      # (for the shell steps), so no workflow input is ever interpolated into a `run:` script.
      - name: Image metadata
        id: meta
        env:
          IN_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          IN_TORCH_INDEX: ${{ inputs.torch_index }}
          IN_TORCH_SPEC: ${{ inputs.torch_spec }}
        run: |
          set -euo pipefail
          ref="${IN_UPSTREAM_REF:-main}"
          torch_index="${IN_TORCH_INDEX:-https://download.pytorch.org/whl/cu126}"
          torch_spec="${IN_TORCH_SPEC:-torch==2.7.1}"
          # An input is refused rather than escaped: none of the three can contain a space, a quote or a newline.
          printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' \
            || { echo "refusing upstream_ref '$ref'" >&2; exit 1; }
          printf '%s' "$torch_index" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9:/.+_-]*$' \
            || { echo "refusing torch_index '$torch_index'" >&2; exit 1; }
          printf '%s' "$torch_spec" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._=<>!~+,*-]*$' \
            || { echo "refusing torch_spec '$torch_spec'" >&2; exit 1; }
          # The index's last path segment names the wheel flavour in the tag: .../whl/cu124 -> cu124, .../whl/cpu
          # -> cpu. A docker tag only takes [A-Za-z0-9._-], so anything else is refused rather than mangled.
          flavour="$(printf '%s' "$torch_index" | sed 's:/*$::; s:.*/::')"
          printf '%s' "$flavour" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo "the last segment of torch_index '$torch_index' is not usable in a tag: '$flavour'" >&2; exit 1; }
          # A tag is 128 characters at most and a ref can be longer.
          slug="$(printf '%s' "$ref" | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-40 | sed 's/^-*//; s/-*$//')"
          [ -n "$slug" ] || slug=ref
          image=decider-torch
          tag="${flavour}-${slug}"
          name="${image}-${tag}-amd64"
          {
            echo "ref=$ref"
            echo "torch_index=$torch_index"
            echo "torch_spec=$torch_spec"
            echo "flavour=$flavour"
            echo "image=$image"
            echo "tag=$tag"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_REF=$image:$tag"
            echo "ARTIFACT_NAME=$name"
            echo "UPSTREAM_REF=$ref"
            echo "TORCH_INDEX=$torch_index"
            echo "TORCH_SPEC=$torch_spec"
          } >> "$GITHUB_ENV"
          echo "### decider-torch : \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          # load: without it the image only lives in the buildx cache and `docker save` would have nothing to export.
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            DECIDER_REF=${{ steps.meta.outputs.ref }}
            TORCH_INDEX=${{ steps.meta.outputs.torch_index }}
            TORCH_SPEC=${{ steps.meta.outputs.torch_spec }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner has no GPU, and this image deliberately does not carry libcuda.so.1 -- the host driver
      # injects it at run time -- so the engine cannot be built here. What can be checked is the image buildx
      # just loaded, the one the next step saves; scripts/check_image.py is the same file the build already ran
      # inside that image, so this is a re-run of the same contract on the artifact, not a second opinion.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker image inspect --format 'image id={{.Id}} size={{.Size}} bytes' "$IMAGE_REF"
          docker run --rm "$IMAGE_REF" python /app/scripts/check_image.py

      - name: Save image and checksum
        run: |
          set -euo pipefail
          if command -v pigz >/dev/null 2>&1; then comp=pigz; else comp=gzip; fi
          echo "compressing with $comp"
          docker save "$IMAGE_REF" | "$comp" > "${RUNNER_TEMP}/${ARTIFACT_NAME}.tar.gz"
          cd "${RUNNER_TEMP}"
          # Only the file name goes in the checksum file, so `sha256sum -c` works in the download directory.
          sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"
          ls -lh "${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}.tar.gz.sha256"

      - name: Manifest
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          {
            echo "image:            $IMAGE_REF"
            echo "image_id:         $(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
            echo "image_size_bytes: $(docker image inspect --format '{{.Size}}' "$IMAGE_REF")"
            echo "platform:         linux/amd64"
            echo "base:             python:3.12-slim-bookworm"
            echo "engine:           decider.serve on decider.engine_v2.EngineV2 (torch)"
            echo "upstream:         https://github.com/Mapika/decider @ ${UPSTREAM_REF}"
            echo "torch_index:      ${TORCH_INDEX}"
            echo "torch_spec:       ${TORCH_SPEC}"
            echo "tar_gz:           ${ARTIFACT_NAME}.tar.gz"
            echo "tar_gz_bytes:     $(stat -c %s "${ARTIFACT_NAME}.tar.gz")"
            echo "tar_gz_sha256:    $(cut -d' ' -f1 "${ARTIFACT_NAME}.tar.gz.sha256")"
            echo "built_at:         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:              ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "--- runtime ---"
            docker run --rm "$IMAGE_REF" python -c "import importlib.metadata as m,sys;print('python='+sys.version.split()[0]);print('\n'.join(p+'='+m.version(p) for p in ('decider-ai','torch','transformers','flash-linear-attention','triton','causal_conv1d','numpy','fastapi','uvicorn')))" \
              || echo "runtime probe failed (not fatal)"
          } | tee "${ARTIFACT_NAME}.manifest.txt"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ${{ runner.temp }}/${{ steps.meta.outputs.name }}.tar.gz
            ${{ runner.temp }}/${{ steps.meta.outputs.name }}.tar.gz.sha256
            ${{ runner.temp }}/${{ steps.meta.outputs.name }}.manifest.txt
          if-no-files-found: error
          # The tar is already gzip-compressed; compressing it again only burns CPU and upload time.
          compression-level: 0
          retention-days: 30
          # v4 refuses a duplicate name; without this a manual re-run of the same ref fails outright.
          overwrite: true

      - name: Summary
        run: |
          {
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| image | \`$IMAGE_REF\` |"
            echo "| artifact | \`$ARTIFACT_NAME\` (tar.gz + .sha256 + .manifest.txt) |"
            echo "| upstream | \`https://github.com/Mapika/decider @ ${UPSTREAM_REF}\` |"
            echo "| base | \`python:3.12-slim-bookworm\` + \`${TORCH_INDEX}\` |"
            echo "| weights | not included -- mount the checkpoint |"
            echo ""
            echo "Load on the host (\`--gpus all\`, and a driver that allows CUDA 12.x -- >= 525; the 550.90.12 host qualifies), then:"
            echo ""
            echo '```bash'
            echo "gzip -dc ${ARTIFACT_NAME}.tar.gz | docker load"
            echo ""
            echo "# model from the Hub: both volumes matter, ~4 GB download and a JIT of the Triton kernels"
            echo "docker run --rm --gpus all -p 8000:8000 \\"
            echo "  -v decider-hf:/hf-cache -v decider-triton:/triton-cache \\"
            echo "  ${IMAGE_REF} scripts/serve.sh Mapika/decider-2b 8000"
            echo ""
            echo "# or a checkpoint folder already on the host: nothing is downloaded, nothing to persist"
            echo "docker run --rm --gpus all -p 8000:8000 -v /srv/decider-2b:/models/decider-2b:ro \\"
            echo "  ${IMAGE_REF} scripts/serve.sh /models/decider-2b 8000"
            echo ""
            echo "curl -s localhost:8000/health"
            echo '```'
            echo ""
            echo "Start-up is not instant: Triton compiles its kernels for the target GPU once, then \`decider.serve\`"
            echo "captures its whole CUDA graph grid (89 graphs) before answering. \`DECIDER_WARMUP=0\` skips the capture."
            echo "On a 44 GiB A40 that grid does not fit at 4B -- shrink it with \`DECIDER_B_BUCKETS=1,2,4\` (51 graphs)."
          } >> "$GITHUB_STEP_SUMMARY"
